<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" height="380" role="img" aria-label="Users discovering and commenting on projects">
  <defs>
    <linearGradient id="ub-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#564CE5"/>
      <stop offset="1" stop-color="#7c6fe8"/>
    </linearGradient>
  </defs>

  <!-- halo -->
  <circle cx="190" cy="190" r="140" fill="#ecebfd"/>

  <!-- decorative dots -->
  <g fill="#7c6fe8" opacity="0.55">
    <circle cx="40" cy="55" r="5"/>
    <circle cx="345" cy="60" r="4"/>
    <circle cx="340" cy="330" r="6"/>
    <circle cx="35" cy="325" r="4"/>
  </g>

  <!-- pin board with project cards -->
  <g>
    <rect x="74" y="70" width="230" height="140" rx="8" fill="#ffffff" stroke="#e0ddfa" stroke-width="2"/>
    <rect x="96" y="92" width="84" height="74" rx="6" fill="#e9e7fb"/>
    <rect x="106" y="104" width="52" height="7" rx="3.5" fill="#564CE5"/>
    <rect x="106" y="120" width="64" height="5" rx="2.5" fill="#cfcdea"/>
    <rect x="106" y="134" width="48" height="5" rx="2.5" fill="#cfcdea"/>
    <rect x="198" y="92" width="84" height="74" rx="6" fill="#f4d9ff"/>
    <rect x="208" y="104" width="52" height="7" rx="3.5" fill="#a855f7"/>
    <rect x="208" y="120" width="64" height="5" rx="2.5" fill="#e0c4f2"/>
    <circle cx="264" cy="146" r="6" fill="#28c840"/>
    <circle cx="96" cy="88" r="6" fill="#ff5f57"/>
    <circle cx="282" cy="88" r="6" fill="#febc2e"/>
  </g>

  <!-- user avatar -->
  <circle cx="120" cy="250" r="22" fill="#564CE5"/>
  <circle cx="120" cy="242" r="8" fill="#ffffff"/>
  <path d="M104 266 C104 252 136 252 136 266 Z" fill="#ffffff"/>

  <!-- comment bubble 1 -->
  <g>
    <rect x="154" y="232" width="150" height="42" rx="10" fill="#ffffff" stroke="#cfcdea" stroke-width="1.5"/>
    <path d="M168 274 L172 286 L180 274 Z" fill="#ffffff" stroke="#d6d3f2"/>
    <rect x="168" y="244" width="90" height="7" rx="3.5" fill="#b9b3ef"/>
    <rect x="168" y="258" width="120" height="6" rx="3" fill="#e2e0f8"/>
  </g>

  <!-- like heart -->
  <g transform="translate(300 138)">
    <path d="M0 8 C0 2 4 -2 10 2 C16 -2 20 2 20 8 C20 14 10 20 10 20 C10 20 0 14 0 8 Z" fill="#ff5f57" transform="scale(1.4)"/>
  </g>
</svg>
