<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Info </title>
<link href="../src/output.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-slate-100 min-h-screen p-6 md:p-10 font-sans">

  <a href="Home-page.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-indigo-600 text-sm mb-6 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Back To Home
  </a>

  <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl ring-1 ring-slate-200 overflow-hidden grid grid-cols-1 md:grid-cols-[280px_1fr]">

    <!-- Side panel -->
    <div class="bg-gradient-to-br from-indigo-600 via-indigo-500 to-violet-400 p-10 flex flex-col items-center gap-6 relative overflow-hidden">
      <div class="absolute -top-14 -right-14 w-40 h-40 bg-white/10 rounded-full"></div>

      <div class="relative w-36 h-36 z-10">
        <div class="w-full h-full rounded-full bg-white/20 border-4 border-white/50 flex items-center justify-center text-5xl">
          
        </div>
        <button class="absolute bottom-1 right-1 w-10 h-10 rounded-full bg-white text-indigo-600 flex items-center justify-center shadow-lg hover:scale-105 hover:bg-indigo-50 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
      </div>

      <div class="w-full z-10">
        <label class="block text-sm font-semibold text-white/85 mb-2">Username</label>
        <input type="text" placeholder="username"
          class="w-full px-4 py-3 rounded-xl bg-white/15 border border-white/35 text-white placeholder-white/70 text-sm focus:outline-none focus:ring-4 focus:ring-white/25 focus:border-white transition">
      </div>
    </div>

    <!-- Content -->
    <div class="p-8 md:p-11">
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight mb-1">Personal info</h1>
      <p class="text-sm text-slate-400 mb-8">Manage your account details and preferences</p>

      <div class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Last name</label>
            <input type="text" placeholder="Your last name"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">First name</label>
            <input type="text" placeholder="Your first name"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white transition">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
          <input type="email" placeholder="Email@gmail.com"
            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white transition">
        </div><div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Change password</label>
          <div class="relative">
            <input type="password" id="pwd" value="1234567"
              class="w-full px-4 py-3 pr-11 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white transition">
            <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 transition-colors">
              <svg id="eyeIcon" class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Phone Number</label>
          <input type="tel" placeholder="0123456789"
            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white transition">
        </div>
      </div>

      <div class="flex justify-between items-center mt-9 pt-6 border-t border-slate-100">
        <button class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-white border border-rose-200 text-rose-600 text-sm font-semibold hover:bg-rose-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Log out
        </button>
        <a href="Home-page.html" class="px-8 py-3 rounded-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 transition-all">
          Save changes
        </a>
      </div>
    </div>
  </div>

<script>
  function togglePwd() {
    const pwd = document.getElementById('pwd');
    const icon = document.getElementById('eyeIcon');
    const isHidden = pwd.type === 'password';
    pwd.type = isHidden ? 'text' : 'password';
    icon.innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.7 18.7 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.7 18.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
</script>
 <script src="../node_modules/flowbite/dist/flowbite.min.js"> </script>
    <script src="../node_modules/preline/dist/preline.js"> </script>
</body>
</html>
