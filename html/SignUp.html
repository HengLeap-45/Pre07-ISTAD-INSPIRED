<!DOCTYPE html>

<body class="bg-gray-50 m-0 p-0 overflow-hidden h-screen">
 
  <div class="flex items-center justify-center w-full h-full px-4">

        </svg>

      </a>
 
      <div class="bg-white border border-gray-200 rounded-3xl shadow-sm px-6 py-8">
 
        <h1 class="text-center text-base font-bold text-gray-900 mb-6">Welcome back</h1>
 
      
        <div class="space-y-2 mb-5">
 
          
          <button type="button"
            class="w-full flex items-center justify-center gap-2 border border-gray-200 rounded-xl py-2.5 px-3 text-xs font-medium text-gray-800 hover:bg-gray-50 transition-colors">

              <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>

            <svg class="w-4 h-4" fill="white" viewBox="0 0 24 24">

        </div>
 
     
        <div class="flex items-center gap-3 my-4">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-xs font-semibold text-gray-800">Or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>
 
     
        <form class="space-y-3">
         
          <div>
            <label for="fullname" class="block text-xs font-semibold text-gray-900 mb-1">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your Fullname"
              class="w-full rounded-xl border border-gray-200 py-2 px-3 text-xs text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400" />
          </div>
 
          
          <div>
            <label for="email" class="block text-xs font-semibold text-gray-900 mb-1">Email Address</label>
            <input type="email" id="email" placeholder="Enter your Email Address"
              class="w-full rounded-xl border border-gray-200 py-2 px-3 text-xs text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400" />
          </div>
 
        
          <div>
            <label for="password" class="block text-xs font-semibold text-gray-900 mb-1">Password</label>
            <input type="password" id="password" placeholder="Enter your Password"
              class="w-full rounded-xl border border-gray-200 py-2 px-3 text-xs text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400" />
          </div>
 
   
          <button type="submit"
            class="w-full text-center bg-[#564CE5] text-white rounded-xl py-2 px-3 text-xs font-semibold hover:bg-[#4a3bc4] transition-colors">
            Create your account
          </button>
        </form>
 
      </div>

 <script src="../node_modules/flowbite/dist/flowbite.min.js"> </script>
