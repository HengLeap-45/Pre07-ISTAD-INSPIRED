<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Login & Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-white from-slate-900 via-blue-900 to-slate-900 m-0 p-0 overflow-hidden" style="height: 100vh;">
    <div class="h-screen flex items-center justify-center px-4 pt-8">
        <div class="w-full max-w-md">
            <div class="bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8 border border-white/20">
                
                <div class="flex gap-3 mb-6 bg-gradient-to-r from-gray-100 to-gray-50 p-1.5 rounded-xl">
                    <button id="loginTab" class="flex-1 px-4 py-2.5 bg-white text-blue-600 rounded-lg text-sm font-bold shadow-lg cursor-pointer transition transform hover:scale-105 border border-blue-200">
                        📝 Log In
                    </button>
                    <button id="signupTab" class="flex-1 px-4 py-2.5 text-gray-600 rounded-lg text-sm font-bold cursor-pointer transition hover:text-blue-600">
                        ✨ Sign Up
                    </button>
                </div>
                <form id="loginForm" class="w-200 space-y-4">
                    <div class="w-200 mb-5">
                        <h2 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-blue-700 bg-clip-text text-transparent">Welcome Back!</h2>
                        <p class="text-gray-500 text-xs mt-1">Login to access your account</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-1.5 flex items-center">
                            <span class="text-lg mr-2">📧</span> Email Address
                        </label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" 
                            class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition bg-gray-50 hover:bg-white" required>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-sm font-bold text-gray-800 flex items-center">
                                <span class="text-lg mr-2">🔐</span> Password
                            </label>
                            <a href="#" class="text-xs text-blue-600 hover:text-blue-700 font-bold hover:underline">Forgot?</a>
                        </div>
                        <input type="password" id="loginPassword" placeholder="••••••••" 
                            class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition bg-gray-50 hover:bg-white" required>
                    </div>

                    <div id="loginError" class="hidden bg-red-50 border-2 border-red-300 text-red-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2">
                        <span>⚠️</span>
                        <span id="loginErrorText"></span>
                    </div>
                    <div id="loginSuccess" class="hidden bg-green-50 border-2 border-green-300 text-green-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2">
                        <span>✅</span>
                        <span id="loginSuccessText"></span>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white py-2.5 rounded-xl font-bold text-sm transition transform hover:scale-105 hover:shadow-lg shadow-md mt-3">
                        Log In Now →
                    </button>
                    <p class="text-center text-xs text-gray-600 mt-3">
                        Don't have an account? <button type="button" onclick="document.getElementById('signupTab').click()" class="text-blue-600 hover:text-blue-700 font-bold hover:underline">Create one</button>
                    </p>
                </form>
                <form id="signupForm" class="space-y-4 hidden">
                    <div class="mb-5">
                        <h2 class="text-2xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-blue-600 ">Create Account</h2>
                        <p class="text-gray-500 text-xs mt-1">Join us and start today</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-1.5 flex items-center">
                            <span class="text-lg mr-2">👤</span> Full Name
                        </label>
                        <input type="text" id="signupName" placeholder="your full name" 
                            class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-sm focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition bg-gray-50 hover:bg-white" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-1.5 flex items-center">
                            <span class="text-lg mr-2">📧</span> Email Address
                        </label>
                        <input type="email" id="signupEmail" placeholder="you@example.com" 
                            class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-sm focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition bg-gray-50 hover:bg-white" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-1.5 flex items-center">
                            <span class="text-lg mr-2">🔐</span> Password
                        </label>
                        <input type="password" id="signupPassword" placeholder="••••••••" 
                            class="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-sm focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition bg-gray-50 hover:bg-white" required>
                    </div>
                    <div id="signupError" class="hidden bg-red-50 border-2 border-red-300 text-red-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2">
                        <span>⚠️</span>
                        <span id="signupErrorText"></span>
                    </div>
                    <div id="signupSuccess" class="hidden bg-green-50 border-2 border-green-300 text-green-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2">
                        <span>✅</span>
                        <span id="signupSuccessText"></span>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-700 text-white py-2.5 rounded-xl font-bold text-sm transition transform hover:scale-105 hover:shadow-lg shadow-md mt-3">
                        Create Account Now →
                    </button>
                    <p class="text-center text-xs text-gray-600 mt-3">
                        Already have an account? <button type="button" onclick="document.getElementById('loginTab').click()" class="text-blue-600 hover:text-blue-700 font-bold hover:underline">Log in</button>
                    </p>
                </form>
            </div>
            <p class="text-center text-white/70 text-xs mt-4 px-2 font-medium">
                By continuing, you agree to our <span class="text-white cursor-pointer hover:underline">Terms</span> and <span class="text-white cursor-pointer hover:underline">Privacy</span>
            </p>
        </div>
    </div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        // Toggle between forms
        loginTab.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            loginTab.classList.add('bg-white', 'text-blue-600', 'border-blue-200');
            loginTab.classList.remove('text-gray-600');
            signupTab.classList.remove('text-blue-600');
        });

        signupTab.addEventListener('click', () => {
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            signupTab.classList.add('text-blue-600');
            signupTab.classList.remove('text-gray-600');
            loginTab.classList.remove('text-blue-600');
        });

        // LOGIN FORM SUBMISSION
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const errorText = document.getElementById('loginErrorText');
            const successText = document.getElementById('loginSuccessText');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const response = await fetch('https://your-api.com/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successText.textContent = data.message || 'Login successful!';
                    successDiv.classList.remove('hidden');
                    localStorage.setItem('access_token', data.data.access_token);
                    localStorage.setItem('refresh_token', data.data.refresh_token);
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    const errorMessage = data.errors?.length > 0 ? data.errors[0] : 'Login failed';
                    errorText.textContent = errorMessage;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorText.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });

        // SIGNUP FORM SUBMISSION
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const errorDiv = document.getElementById('signupError');
            const successDiv = document.getElementById('signupSuccess');
            const errorText = document.getElementById('signupErrorText');
            const successText = document.getElementById('signupSuccessText');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const response = await fetch('https://inspire-api.gital.me/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successText.textContent = data.message || 'Account created successfully!';
                    successDiv.classList.remove('hidden');
                    localStorage.setItem('access_token', data.data.access_token);
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    const errorMessage = data.errors?.length > 0 ? data.errors[0] : 'Signup failed';
                    errorText.textContent = errorMessage;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorText.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
