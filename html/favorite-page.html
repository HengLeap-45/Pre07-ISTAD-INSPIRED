<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Favorites</title>
<meta name="description" content="Your saved STADIA projects.">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var t=localStorage.getItem('stadia_theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<link href="../src/output.css" rel="stylesheet">
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto py-6 px-4">

    <!-- Top bar -->
    <div class="flex items-center justify-between mb-8">
      <a href="./index.html" class="flex items-center gap-2 text-sm font-semibold text-gray-900 hover:text-blue-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back To Home
      </a>
      <button type="button" data-action="toggle-theme" title="Toggle dark mode" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-200 text-gray-800">
        <svg class="theme-icon-sun w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m14.14 6.66l-.7-.7M7.05 7.05l-.7-.7m11.32 0l-.7.7M7.05 16.95l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="theme-icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
      <a href="./settings.html" type="button" data-tooltip-target="settings-tooltip" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-200 text-gray-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </a>
      <div id="settings-tooltip" role="tooltip" class="absolute z-10 invisible inline-block px-2 py-1 text-xs font-medium text-white bg-gray-900 rounded-lg shadow-sm opacity-0 tooltip">
        Settings
      </div>
    </div>

    <!-- Profile header (real logged-in user) -->
    <div class="flex items-start gap-5 mb-6">
      <span id="profileAvatar" class="w-24 h-24 rounded-full bg-gray-300 overflow-hidden flex items-center justify-center text-white text-3xl font-bold shrink-0"></span>

      <div class="flex-1 pt-1">
        <h1 id="profileName" class="text-xl font-bold text-gray-900">Loading...</h1>
        <p id="profileUsername" class="text-sm text-gray-500 mt-0.5"></p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex items-center bg-gray-200 rounded-xl p-1 mb-8">
      <a href="./history-page.html" class="flex-1 flex items-center justify-center py-2.5 rounded-lg text-gray-500 hover:text-gray-700" title="View History">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 2" />
        </svg>
      </a>
      <a href="./favorite-page.html" class="flex-1 flex items-center justify-center py-2.5 rounded-lg bg-white shadow-sm" title="Favorites">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 4h12v16l-6-4-6 4V4z" />
        </svg>
      </a>
      <a href="./dashboard.html" class="flex-1 flex items-center justify-center py-2.5 rounded-lg text-gray-500 hover:text-gray-700" title="My Dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" />
        </svg>
      </a>
    </div>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-900">My Favorites</h2>
    </div>

    <!-- Not logged in -->
    <div id="auth-required" class="hidden text-sm text-gray-600 py-8 text-center border border-dashed border-gray-300 rounded-xl">
      Please <a href="./login.html" class="text-[#564CE5] font-semibold hover:underline">sign in</a> to see your favorites.
    </div>

    <!-- Loading state -->
    <div id="loading-state" class="text-sm text-gray-500 py-8 text-center">
      Loading favorites...
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-sm text-gray-500 py-8 text-center border border-dashed border-gray-300 rounded-xl">
      No favorites yet. Tap <strong>Save</strong> on any project to bookmark it here.
    </div>

    <!-- Cards render here -->
    <div id="activity-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>

  </div>

  <template id="favoriteCardTemplate">
    <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col" data-project-uuid="">
      <a class="card-link relative bg-gray-100 h-32 flex items-center justify-center" href="#">
        <img class="card-thumb hidden w-full h-32 object-cover" alt="" />
      </a>
      <div class="p-3 flex-1 flex flex-col">
        <a class="card-link" href="#">
          <p class="card-title text-sm font-semibold text-gray-900 mb-1 line-clamp-1"></p>
        </a>
        <p class="card-saved text-xs text-gray-400 mb-3"></p>
        <button type="button" class="card-remove mt-auto self-start px-2 py-1.5 text-xs font-semibold rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 4h12v16l-6-4-6 4V4z" />
          </svg>
          Unsave
        </button>
      </div>
    </div>
  </template>

    <script src="../node_modules/flowbite/dist/flowbite.min.js"> </script>
    <script src="../node_modules/preline/dist/preline.js"></script>
    <!-- STADIA API wiring -->
    <script src="../node_modules/@multiavatar/multiavatar/multiavatar.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/media.js"></script>
    <script src="../js/project.js"></script>
    <script src="../js/users.js"></script>
    <script src="../js/favorites.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const grid = document.getElementById('activity-grid');
        const loading = document.getElementById('loading-state');
        const empty = document.getElementById('empty-state');
        const authRequired = document.getElementById('auth-required');
        const template = document.getElementById('favoriteCardTemplate');

        if (!window.AuthAPI || !AuthAPI.isAuthenticated()) {
          loading.classList.add('hidden');
          authRequired.classList.remove('hidden');
          return;
        }

        try {
          const user = await UsersAPI.getCurrentUser();
          if (user) {
            document.getElementById('profileName').textContent = user.given_name
              ? `${user.given_name} ${user.family_name || ''}`.trim() : (user.username || 'Account');
            document.getElementById('profileUsername').textContent = user.username ? '@' + user.username : '';
            if (window.AuthAPI) AuthAPI.renderUserAvatar(document.getElementById('profileAvatar'), user);
          }
        } catch (e) { /* profile header is cosmetic; ignore failures */ }

        function timeAgo(iso) {
          const diffMs = Date.now() - new Date(iso).getTime();
          const mins = Math.round(diffMs / 60000);
          if (mins < 1) return 'Just now';
          if (mins < 60) return `${mins}m ago`;
          const hours = Math.round(mins / 60);
          if (hours < 24) return `${hours}h ago`;
          const days = Math.round(hours / 24);
          if (days < 30) return `${days}d ago`;
          return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function renderCard(entry) {
          const node = template.content.firstElementChild.cloneNode(true);
          node.dataset.projectUuid = entry.uuid;

          const links = node.querySelectorAll('.card-link');
          links.forEach(a => a.href = './project-detail.html?id=' + encodeURIComponent(entry.uuid));

          const thumb = node.querySelector('.card-thumb');
          const thumbUrl = window.MediaAPI ? MediaAPI.getMediaUrl(entry.thumbnail) : '';
          if (thumbUrl) {
            thumb.src = thumbUrl;
            thumb.alt = entry.title || '';
            thumb.classList.remove('hidden');
          }

          node.querySelector('.card-title').textContent = entry.title || 'Untitled project';
          node.querySelector('.card-saved').textContent = 'Saved ' + timeAgo(entry.savedAt);

          node.querySelector('.card-remove').addEventListener('click', async () => {
            const ok = window.showConfirmModal
              ? await showConfirmModal('Remove this project from your favorites?', { confirmLabel: 'Unsave', danger: true })
              : confirm('Remove this project from your favorites?');
            if (!ok) return;
            FavoritesAPI.remove(entry.uuid);
            node.remove();
            if (!FavoritesAPI.getAll().length) renderList();
          });

          return node;
        }

        function renderList() {
          const items = FavoritesAPI.getAll();
          loading.classList.add('hidden');
          if (!items.length) {
            empty.classList.remove('hidden');
            grid.classList.add('hidden');
            return;
          }
          grid.innerHTML = '';
          items.forEach(entry => grid.appendChild(renderCard(entry)));
          empty.classList.add('hidden');
          grid.classList.remove('hidden');
        }

        renderList();
      });
    </script>
  </body>
  </html>
